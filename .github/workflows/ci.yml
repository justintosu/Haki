name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - name: Run core tests
        run: scripts/test-core.sh

  build-ios:
    name: Build iOS app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          # Newest installed Xcode 26 or later that isn't a beta.
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i simulator || true

      - name: Build for the iOS Simulator
        run: |
          set +e
          xcodebuild \
            -project Haki.xcodeproj \
            -scheme Haki \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1
          status=$?
          grep -E "error:|\*\* BUILD" build.log
          echo "xcodebuild exited with $status"
          exit $status

      - name: Summarize errors
        if: failure()
        run: |
          echo "==== Compiler errors ===="
          grep -E "error:" build.log | sed -E 's#^.*/Haki/##' | sort -u | head -300 || true

      - name: Summarize warnings
        if: success()
        run: |
          echo "==== Compiler warnings in Haki sources ===="
          grep -E "warning:" build.log | grep "/Haki/Haki/" | sed -E 's#^.*/Haki/Haki/#Haki/#' | sort -u | head -200 || true

      - name: Show resolved package versions
        if: always()
        run: cat Haki.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved || true

  ui-tests:
    name: UI tests (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Pick and boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          preferred = [d for d in phones if "Pro" not in d["name"] and "Plus" not in d["name"] and "Max" not in d["name"]]
          pick = (preferred or phones)[-1]
          print(pick["udid"])
          sys.stderr.write("Using " + pick["name"] + "\n")
          ')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          # Union Square, New York, so map searches have results.
          xcrun simctl location "$UDID" set 40.7359,-73.9911 || true
          xcrun simctl privacy "$UDID" grant location justin.Haki || true

      - name: Run UI tests
        run: |
          set +e
          xcodebuild test \
            -project Haki.xcodeproj \
            -scheme Haki \
            -destination "id=$SIM_UDID" \
            -resultBundlePath UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          status=$?
          grep -E "error:|Test Case .*(passed|failed)|\*\* TEST|XCTAssert|Expected to see|App stopped running|crash" test.log | sed -E 's#^.*/Haki/##' | head -400
          echo "xcodebuild test exited with $status"
          exit $status

      - name: Test results
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path UITests.xcresult || true
          xcrun xcresulttool get test-results tests --path UITests.xcresult | python3 -c '
          import json, sys
          def walk(node, path=""):
              name = node.get("name", "")
              result = node.get("result", "")
              kind = node.get("nodeType", "")
              here = path + "/" + name if path else name
              if kind == "Test Case":
                  print(f"{result:8} {here}")
              if kind == "Failure Message":
                  print(f"         -> {name}")
              for child in node.get("children", []):
                  walk(child, here if kind != "Failure Message" else path)
          data = json.load(sys.stdin)
          for node in data.get("testNodes", []):
              walk(node)
          ' || true

      - name: Crash reports
        if: always()
        run: |
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/Haki* 2>/dev/null | head -3); do
            echo "==== $f"
            head -c 12000 "$f"
            echo
          done
          echo "(end of crash reports)"

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path UITests.xcresult --output-path screenshots || true
          ls screenshots | head -200

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots
          if-no-files-found: warn
          retention-days: 14
