name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - name: Run core tests
        run: scripts/test-core.sh

  build-ios:
    name: Build iOS app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          # Newest installed Xcode 26 or later that isn't a beta.
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i simulator || true

      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Haki.xcodeproj \
            -target Haki \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning:|\*\* BUILD" || true
          exit ${PIPESTATUS[0]}

      - name: Summarize errors
        if: failure()
        run: |
          echo "==== Compiler errors ===="
          grep -E "error:" build.log | sed -E 's#^.*/Haki/##' | sort -u | head -300 || true

      - name: Summarize warnings
        if: success()
        run: |
          echo "==== Compiler warnings ===="
          grep -E "warning:" build.log | sed -E 's#^.*/Haki/##' | sort -u | head -200 || true
